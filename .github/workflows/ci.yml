name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - development
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/
          NEXT_PUBLIC_IMAGE_ASSETS_URL: https://api.example.com/
        run: bun run build

  publish-and-deploy:
    name: Publish image and deploy to VPS
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      SERVER_FINGERPRINT: ${{ secrets.SERVER_FINGERPRINT }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PATH: ${{ secrets.SERVER_PATH }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_USER: ${{ secrets.SERVER_USER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_IMAGE_ASSETS_URL: ${{ vars.NEXT_PUBLIC_IMAGE_ASSETS_URL }}
        run: |
          set -Eeuo pipefail
          required=(NEXT_PUBLIC_API_URL NEXT_PUBLIC_IMAGE_ASSETS_URL SERVER_FINGERPRINT SERVER_HOST SERVER_PATH SERVER_PORT SERVER_SSH_KEY SERVER_USER)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub configuration: $name" >&2
              exit 1
            fi
          done
          [[ "$NEXT_PUBLIC_API_URL" =~ ^https?:// ]] || { echo "NEXT_PUBLIC_API_URL must be an absolute HTTP(S) URL." >&2; exit 1; }
          [[ "$NEXT_PUBLIC_IMAGE_ASSETS_URL" =~ ^https?:// ]] || { echo "NEXT_PUBLIC_IMAGE_ASSETS_URL must be an absolute HTTP(S) URL." >&2; exit 1; }
          [[ "$SERVER_FINGERPRINT" =~ ^SHA256: ]] || { echo "SERVER_FINGERPRINT must be an SHA256 SSH fingerprint." >&2; exit 1; }
          [[ "$SERVER_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo "SERVER_HOST must be a hostname or IPv4 address." >&2; exit 1; }
          [[ "$SERVER_PORT" =~ ^[0-9]+$ ]] || { echo "SERVER_PORT must be numeric." >&2; exit 1; }
          (( 10#$SERVER_PORT >= 1 && 10#$SERVER_PORT <= 65535 )) || { echo "SERVER_PORT must be between 1 and 65535." >&2; exit 1; }
          [[ "$SERVER_PATH" =~ ^/[a-zA-Z0-9._/-]+$ ]] || { echo "SERVER_PATH must be an absolute path containing no spaces." >&2; exit 1; }
          [[ "$SERVER_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo "SERVER_USER is invalid." >&2; exit 1; }

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_IMAGE_ASSETS_URL=${{ vars.NEXT_PUBLIC_IMAGE_ASSETS_URL }}
            NEXT_PUBLIC_TELEMETRY_ENDPOINT=${{ vars.NEXT_PUBLIC_TELEMETRY_ENDPOINT }}
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' >"$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null

          scanned_keys="$RUNNER_TEMP/scanned-host-keys"
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >"$scanned_keys"
          : >"$HOME/.ssh/known_hosts"
          while IFS= read -r host_key; do
            fingerprint=$(printf '%s\n' "$host_key" | ssh-keygen -lf - | awk '{print $2}')
            if [[ "$fingerprint" == "$SERVER_FINGERPRINT" ]]; then
              printf '%s\n' "$host_key" >>"$HOME/.ssh/known_hosts"
            fi
          done <"$scanned_keys"
          [[ -s "$HOME/.ssh/known_hosts" ]] || { echo "The scanned SSH host key does not match SERVER_FINGERPRINT." >&2; exit 1; }
          chmod 600 "$HOME/.ssh/known_hosts"
          printf 'Host deployment\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile %s\n  UserKnownHostsFile %s\n  BatchMode yes\n  StrictHostKeyChecking yes\n' \
            "$SERVER_HOST" "$SERVER_PORT" "$SERVER_USER" "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts" >"$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Log in to registry on VPS
        id: vps-registry-login
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh deployment "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

      - name: Update frontend and containers
        env:
          APP_IMAGE: ${{ steps.image.outputs.name }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          ssh deployment bash -s -- "$SERVER_PATH" "$APP_IMAGE" "$GITHUB_SHA" "$DEPLOY_BRANCH" <<'REMOTE'
          set -Eeuo pipefail

          FRONTEND_PATH=$1
          APP_IMAGE=$2
          APP_IMAGE_TAG=$3
          DEPLOY_BRANCH=$4
          DEPLOY_ROOT=$(dirname -- "$FRONTEND_PATH")

          if [[ ! -d "$FRONTEND_PATH/.git" ]]; then
            echo "Deployment aborted: $FRONTEND_PATH is not a Git repository" >&2
            exit 1
          fi
          if [[ ! -f "$DEPLOY_ROOT/docker-compose.yml" ]]; then
            echo "Deployment aborted: $DEPLOY_ROOT/docker-compose.yml does not exist" >&2
            exit 1
          fi

          cd "$FRONTEND_PATH"
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Deployment aborted: the frontend repository has uncommitted tracked changes" >&2
            git status --short --untracked-files=no
            exit 1
          fi

          git fetch origin "$DEPLOY_BRANCH"
          git switch "$DEPLOY_BRANCH"
          git pull --ff-only origin "$DEPLOY_BRANCH"

          cd "$DEPLOY_ROOT"
          docker compose config --quiet
          docker pull "$APP_IMAGE:$APP_IMAGE_TAG"
          docker tag "$APP_IMAGE:$APP_IMAGE_TAG" sahmito-front:latest

          docker compose up -d --no-deps --no-build --force-recreate --wait front-blue front-green
          docker compose exec -T proxy nginx -t
          docker compose exec -T proxy nginx -s reload
          docker compose ps front-blue front-green proxy
          REMOTE

      - name: Log out from registry on VPS
        if: always() && steps.vps-registry-login.outcome == 'success'
        run: ssh deployment 'docker logout ghcr.io' || true

      - name: Verify public URL
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: curl --fail --show-error --silent --retry 8 --retry-all-errors --retry-delay 5 "$APP_URL/"
