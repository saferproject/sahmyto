name: CI

on:
  pull_request:
  push:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: bun run audit:prod

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run tsc --noEmit

      - name: Test
        run: bun run test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/
          NEXT_PUBLIC_IMAGE_ASSETS_URL: https://api.example.com/
        run: bun run build
