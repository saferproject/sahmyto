name: CI

on:
  pull_request:
  push:
    branches:
      - development
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: bun run audit:prod

      - name: Type-check
        run: bun run tsc --noEmit

      - name: Test
        run: bun run test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/
          NEXT_PUBLIC_IMAGE_ASSETS_URL: https://api.example.com/
        run: bun run build

  publish-and-deploy:
    name: Publish image and deploy to VPS
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      SERVER_FINGERPRINT: ${{ secrets.SERVER_FINGERPRINT }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PATH: ${{ secrets.SERVER_PATH }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      APP_PORT: ${{ vars.APP_PORT || '80' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_IMAGE_ASSETS_URL: ${{ vars.NEXT_PUBLIC_IMAGE_ASSETS_URL }}
        run: |
          set -Eeuo pipefail
          required=(
            NEXT_PUBLIC_API_URL
            NEXT_PUBLIC_IMAGE_ASSETS_URL
            SERVER_FINGERPRINT
            SERVER_HOST
            SERVER_PATH
            SERVER_PORT
            SERVER_SSH_KEY
            SERVER_USER
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub configuration: $name" >&2
              exit 1
            fi
          done
          [[ "$NEXT_PUBLIC_API_URL" =~ ^https?:// ]] || { echo "NEXT_PUBLIC_API_URL must be an absolute HTTP(S) URL." >&2; exit 1; }
          [[ "$NEXT_PUBLIC_IMAGE_ASSETS_URL" =~ ^https?:// ]] || { echo "NEXT_PUBLIC_IMAGE_ASSETS_URL must be an absolute HTTP(S) URL." >&2; exit 1; }
          [[ "$SERVER_FINGERPRINT" =~ ^SHA256: ]] || { echo "SERVER_FINGERPRINT must be an SHA256 SSH fingerprint." >&2; exit 1; }
          [[ "$SERVER_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo "SERVER_HOST must be a hostname or IPv4 address." >&2; exit 1; }
          [[ "$SERVER_PORT" =~ ^[0-9]+$ ]] || { echo "SERVER_PORT must be numeric." >&2; exit 1; }
          (( 10#$SERVER_PORT >= 1 && 10#$SERVER_PORT <= 65535 )) || { echo "SERVER_PORT must be between 1 and 65535." >&2; exit 1; }
          [[ "$SERVER_PATH" =~ ^/[a-zA-Z0-9._/-]+$ ]] || { echo "SERVER_PATH must be an absolute path containing no spaces." >&2; exit 1; }
          [[ "$SERVER_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo "SERVER_USER is invalid." >&2; exit 1; }
          [[ "$APP_PORT" =~ ^[0-9]+$ ]] || { echo "APP_PORT must be numeric." >&2; exit 1; }

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_IMAGE_ASSETS_URL=${{ vars.NEXT_PUBLIC_IMAGE_ASSETS_URL }}
            NEXT_PUBLIC_TELEMETRY_ENDPOINT=${{ vars.NEXT_PUBLIC_TELEMETRY_ENDPOINT }}
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' >"$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null

          scanned_keys="$RUNNER_TEMP/scanned-host-keys"
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >"$scanned_keys"
          : >"$HOME/.ssh/known_hosts"
          while IFS= read -r host_key; do
            fingerprint=$(printf '%s\n' "$host_key" | ssh-keygen -lf - | awk '{print $2}')
            if [[ "$fingerprint" == "$SERVER_FINGERPRINT" ]]; then
              printf '%s\n' "$host_key" >>"$HOME/.ssh/known_hosts"
            fi
          done <"$scanned_keys"
          [[ -s "$HOME/.ssh/known_hosts" ]] || { echo "The scanned SSH host key does not match SERVER_FINGERPRINT." >&2; exit 1; }
          chmod 600 "$HOME/.ssh/known_hosts"
          printf 'Host deployment\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile %s\n  UserKnownHostsFile %s\n  BatchMode yes\n  StrictHostKeyChecking yes\n' \
            "$SERVER_HOST" "$SERVER_PORT" "$SERVER_USER" "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts" >"$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Upload deployment configuration
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/sahmito-deploy.tar.gz"
          tar -czf "$archive" deploy/docker-compose.production.yml deploy/deploy.sh deploy/nginx/default.blue.conf deploy/nginx/default.green.conf
          ssh deployment "mkdir -p '$SERVER_PATH'"
          scp "$archive" "deployment:$SERVER_PATH/deployment.tar.gz"
          ssh deployment "cd '$SERVER_PATH' && tar -xzf deployment.tar.gz && chmod 700 deploy/deploy.sh && rm deployment.tar.gz"

      - name: Log in to registry on VPS
        id: vps-registry-login
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh deployment "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

      - name: Deploy image
        env:
          APP_IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -Eeuo pipefail
          ssh deployment "cd '$SERVER_PATH' && ./deploy/deploy.sh '$APP_IMAGE' '$GITHUB_SHA' '$APP_PORT'"

      - name: Log out from registry on VPS
        if: always() && steps.vps-registry-login.outcome == 'success'
        run: |
          ssh deployment 'docker logout ghcr.io' || true

      - name: Verify public URL
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: curl --fail --show-error --silent --retry 8 --retry-all-errors --retry-delay 5 "$APP_URL/api/health"
