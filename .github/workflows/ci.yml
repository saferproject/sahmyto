name: CI

on:
  pull_request:
  push:
    branches:
      - development
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: bun run audit:prod

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run tsc --noEmit

      - name: Test
        run: bun run test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/
          NEXT_PUBLIC_IMAGE_ASSETS_URL: https://api.example.com/
        run: bun run build

  publish-and-deploy:
    name: Publish image and deploy to VPS
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      vars.DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_IMAGE_ASSETS_URL: ${{ vars.NEXT_PUBLIC_IMAGE_ASSETS_URL }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          APP_PORT: ${{ vars.APP_PORT || '80' }}
        run: |
          set -Eeuo pipefail
          required=(
            NEXT_PUBLIC_API_URL
            NEXT_PUBLIC_IMAGE_ASSETS_URL
            VPS_HOST
            VPS_USER
            VPS_SSH_PRIVATE_KEY
            VPS_KNOWN_HOSTS
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub configuration: $name" >&2
              exit 1
            fi
          done
          [[ "$NEXT_PUBLIC_API_URL" =~ ^https?:// ]] || { echo "NEXT_PUBLIC_API_URL must be an absolute HTTP(S) URL." >&2; exit 1; }
          [[ "$NEXT_PUBLIC_IMAGE_ASSETS_URL" =~ ^https?:// ]] || { echo "NEXT_PUBLIC_IMAGE_ASSETS_URL must be an absolute HTTP(S) URL." >&2; exit 1; }
          [[ "$VPS_SSH_PORT" =~ ^[0-9]+$ ]] || { echo "VPS_SSH_PORT must be numeric." >&2; exit 1; }
          [[ "$APP_PORT" =~ ^[0-9]+$ ]] || { echo "APP_PORT must be numeric." >&2; exit 1; }

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_IMAGE_ASSETS_URL=${{ vars.NEXT_PUBLIC_IMAGE_ASSETS_URL }}
            NEXT_PUBLIC_TELEMETRY_ENDPOINT=${{ vars.NEXT_PUBLIC_TELEMETRY_ENDPOINT }}
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' >"$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Upload deployment configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          set -Eeuo pipefail
          target="$VPS_USER@$VPS_HOST"
          ssh_options=(-i "$HOME/.ssh/deploy_key" -p "$VPS_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          archive="$RUNNER_TEMP/sahmito-deploy.tar.gz"
          tar -czf "$archive" deploy/docker-compose.production.yml deploy/deploy.sh deploy/nginx/default.blue.conf deploy/nginx/default.green.conf
          ssh "${ssh_options[@]}" "$target" 'mkdir -p "$HOME/sahmito"'
          scp -i "$HOME/.ssh/deploy_key" -P "$VPS_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$archive" "$target:sahmito/deployment.tar.gz"
          ssh "${ssh_options[@]}" "$target" 'cd "$HOME/sahmito" && tar -xzf deployment.tar.gz && chmod 700 deploy/deploy.sh && rm deployment.tar.gz'

      - name: Log in to registry on VPS
        id: vps-registry-login
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          set -Eeuo pipefail
          target="$VPS_USER@$VPS_HOST"
          ssh_options=(-i "$HOME/.ssh/deploy_key" -p "$VPS_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_options[@]}" "$target" "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

      - name: Deploy image
        env:
          APP_IMAGE: ${{ steps.image.outputs.name }}
          APP_PORT: ${{ vars.APP_PORT || '80' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          set -Eeuo pipefail
          target="$VPS_USER@$VPS_HOST"
          ssh_options=(-i "$HOME/.ssh/deploy_key" -p "$VPS_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_options[@]}" "$target" "cd \"\$HOME/sahmito\" && ./deploy/deploy.sh '$APP_IMAGE' '$GITHUB_SHA' '$APP_PORT'"

      - name: Log out from registry on VPS
        if: always() && steps.vps-registry-login.outcome == 'success'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          target="$VPS_USER@$VPS_HOST"
          ssh -i "$HOME/.ssh/deploy_key" -p "$VPS_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" 'docker logout ghcr.io' || true

      - name: Verify public URL
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: curl --fail --show-error --silent --retry 8 --retry-all-errors --retry-delay 5 "$APP_URL/api/health"
