services:
  proxy:
    image: nginx:1.30.4-alpine
    container_name: sahmito-proxy
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx:/etc/nginx/templates:ro
    command: /bin/sh -c "cp /etc/nginx/templates/active.conf /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
    networks:
      - sahmito-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  app-blue:
    image: "${APP_IMAGE:?Set APP_IMAGE}:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG}"
    container_name: sahmito-app-blue
    expose:
      - "3000"
    networks:
      - sahmito-network
    restart: unless-stopped
    healthcheck: &app-healthcheck
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app-green:
    image: "${APP_IMAGE:?Set APP_IMAGE}:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG}"
    container_name: sahmito-app-green
    expose:
      - "3000"
    networks:
      - sahmito-network
    restart: unless-stopped
    healthcheck: *app-healthcheck

networks:
  sahmito-network:
    name: sahmito-network
    driver: bridge
